name: Android APK

on:
  push:
    branches:
      - main
      - dev
      - refactor/mobile-v2
    paths:
      - android/**
      - web/frontend/**
      - .github/workflows/android-apk.yml
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - web/frontend/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 有界超时：connectedCheck 在无 KVM 或模拟器异常时可能长时间挂起。
    # 设 100 分钟让失败快速有界、便于下载日志定位根因，而非烧够默认 6 小时。
    timeout-minutes: 100
    env:
      XIAODA_KEYSTORE_PASSWORD: ${{ secrets.XIAODA_KEYSTORE_PASSWORD }}
      XIAODA_BUILD_PYTHON: python3
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Provision release keystore (if secret present)
        shell: bash
        run: |
          if [ -n "${{ secrets.XIAODA_KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.XIAODA_KEYSTORE_BASE64 }}" | base64 -d > keystore/xiaoda-release.jks
            test -s keystore/xiaoda-release.jks
            echo "release keystore provisioned"
          else
            echo "no keystore secret; release/staging will fall back to debug signing"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11 (Chaquopy build interpreter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Verify APK scanner tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Lint, test, and assemble variants (APK + signed AAB)
        run: ./gradlew lint test assembleDebug assembleStaging assembleRelease bundleRelease

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # websocketChat 已改用 okhttp 直接客户端，不再依赖 WebView 渲染，故可放心用
          # swiftshader_indirect（host 软件渲染）。此前其崩溃正是发生在该测试跑完整前端 SPA 时，
          # 现依赖已移除。-gpu off（guest 软件渲染）会让真实 WebView 渲染网页的
          # androidWebViewBrowserAutomationOperatesLocally 慢到超时，故不用。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # 有界脚本：job 级 timeout-minutes 对 emulator-runner 分离的模拟器进程不生效（实测挂 5h 未终止）。
          # 用 coreutils 的 timeout 在脚本层硬性箍住 gradle，保证 step 一定结束、能上传诊断日志定位根因。
          # --no-daemon：避免 gradle daemon 在测试结束后残留占用 runner，降低被误判为"还在跑"的概率。
          script: timeout 1500 ./gradlew --no-daemon connectedCheck --stacktrace

      - name: Upload connected test results (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK contents
        run: >-
          python scripts/verify_apk.py --source-root .
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/staging/app-staging.apk
          app/build/outputs/apk/release/app-release.apk

      - name: Verify bundled web assets
        run: python scripts/verify_web_assets.py app/build/generated/webAssets "$(python ../scripts/project_version.py)"

      - name: Generate SBOM and NOTICE
        run: |
          python ../scripts/generate_sbom.py app/build/release-artifacts
          test -f app/build/release-artifacts/sbom.spdx.json
          test -f app/build/release-artifacts/NOTICE

      - name: Generate APK and AAB checksums
        run: >
          sha256sum app/build/outputs/apk/*/*.apk
          app/build/outputs/bundle/release/app-release.aab
          app/build/release-artifacts/sbom.spdx.json
          app/build/release-artifacts/NOTICE
          > app/build/outputs/apk/SHA256SUMS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-staging-ci-debug-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/staging/app-staging.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-release-ci-debug-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata (AAB, SBOM, NOTICE, R8 mapping)
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-release-metadata-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/release-artifacts/sbom.spdx.json
            android/app/build/release-artifacts/NOTICE
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
