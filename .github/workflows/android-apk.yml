name: Android APK

on:
  push:
    branches:
      - main
      - dev
      - refactor/mobile-v2
    paths:
      - android/**
      - web/frontend/**
      - .github/workflows/android-apk.yml
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - web/frontend/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Verify APK scanner tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Lint, test, and assemble variants
        run: ./gradlew lint test assembleDebug assembleStaging assembleRelease

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            ./gradlew connectedCheck
            bash scripts/smoke_launch_variants.sh

      - name: Verify APK contents
        run: >-
          python scripts/verify_apk.py --source-root .
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/staging/app-staging.apk
          app/build/outputs/apk/release/app-release.apk

      - name: Verify bundled web assets
        run: python scripts/verify_web_assets.py app/build/generated/webAssets "$(python ../scripts/project_version.py)"

      - name: Generate APK checksums
        run: sha256sum app/build/outputs/apk/*/*.apk > app/build/outputs/apk/SHA256SUMS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-staging-ci-debug-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/staging/app-staging.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoda-android-release-ci-debug-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
